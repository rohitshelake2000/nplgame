<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPL - Nangnur Premier League</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a1628;--card:#121e36;--card2:#1a2a4a;--green:#00c853;--gold:#ffd700;--red:#ff1744;--orange:#ff6d00;--purple:#aa00ff;--white:#eef2f6;--muted:#7a8ea8;--line:rgba(255,255,255,.08)}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
img{max-width:100%;display:block}
a{color:var(--gold);text-decoration:none}

/* HEADER */
.header{position:sticky;top:0;z-index:99;background:linear-gradient(135deg,#0d1b2a,#1b2d4f);border-bottom:2px solid var(--gold);padding:0 16px}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;height:60px;flex-wrap:nowrap;overflow:hidden}
.site-logo{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;border:2px solid var(--gold);flex-shrink:0;cursor:pointer}
.site-logo img{width:100%;height:100%;object-fit:cover}
.site-title{cursor:pointer;flex-shrink:0}
.site-title b{color:var(--gold);font-size:18px;display:block;line-height:1.1}
.site-title small{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:none;color:#ccc;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;border-radius:6px;white-space:nowrap;transition:.2s}
.nav button:hover{background:rgba(255,255,255,.1)}
.nav button.on{background:var(--gold);color:#000}
.hdr-btns{display:flex;gap:6px;flex-shrink:0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border:none;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:#000}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-sm{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.3;pointer-events:none}

/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card-title{color:var(--gold);font-size:18px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:800;text-transform:uppercase}
.bg{background:var(--green);color:#000}
.br{background:var(--red);color:#fff}
.bo{background:var(--orange);color:#000}
.bp{background:var(--purple);color:#fff}
.by{background:var(--gold);color:#000}
.bgr{background:#555;color:#ddd}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--card2);border:1px solid var(--line);color:#ccc;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--gold);color:#000;border-color:var(--gold)}

/* HERO */
.hero{position:relative;border-radius:14px;overflow:hidden;padding:48px 20px;text-align:center;background:linear-gradient(135deg,#0d3b66,#1a5e2a,#0d3b66);border:2px solid var(--gold);margin-bottom:16px;background-size:cover;background-position:center}
.hero-overlay{position:absolute;inset:0;background:rgba(10,22,40,.6);pointer-events:none}
.hero *{position:relative;z-index:1}
.hero-logo{width:90px;height:90px;border-radius:50%;margin:0 auto 10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 20px rgba(255,215,0,.4)}
.hero-logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:36px;font-weight:900;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.5)}
.hero h1 span{color:var(--gold)}
.hero p{color:#cde;font-size:16px;margin-top:6px;font-weight:600}
.hero .stag{display:inline-block;margin-top:10px;background:rgba(0,0,0,.5);color:var(--gold);padding:4px 16px;border-radius:20px;font-weight:800;font-size:13px;letter-spacing:1px}
@media(max-width:600px){.hero h1{font-size:24px}.hero{padding:30px 14px}}

/* STAT CHIPS */
.chip{background:var(--card2);border-radius:10px;padding:12px;text-align:center;border-bottom:2px solid var(--gold)}
.chip b{font-size:24px;color:var(--gold);display:block}
.chip span{font-size:11px;color:var(--muted);text-transform:uppercase}

/* TEAM */
.tlogo{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.3);flex-shrink:0;overflow:hidden;font-size:16px}
.tlogo img{width:100%;height:100%;object-fit:cover}
.team-card{border-radius:14px;padding:18px;color:#fff;position:relative;overflow:hidden;cursor:pointer;transition:.2s;border:2px solid rgba(255,255,255,.1);min-height:150px}
.team-card:hover{transform:translateY(-3px);border-color:var(--gold)}
.team-card .tlogo{width:56px;height:56px;font-size:26px;background:rgba(0,0,0,.3)}
.team-card h3{font-size:18px;margin:8px 0 2px}
.team-card p{font-size:11px;opacity:.85}
.team-card .tp{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}

/* MATCH */
.match{background:var(--card2);border-radius:10px;padding:12px;border-left:3px solid var(--gold)}
.match.live{border-left-color:var(--red);animation:livepulse 1.5s infinite}
@keyframes livepulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,23,68,.3)}50%{box-shadow:inset 0 0 10px 0 rgba(255,23,68,.3)}}
.match .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:4px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.vs .t{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.vs .t:last-child{justify-content:flex-end;text-align:right}
.vs .sc{font-size:12px;color:var(--gold);font-weight:700;display:block}
.vs .vv{background:var(--gold);color:#000;font-weight:900;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.result{margin-top:8px;font-size:12px;color:#afc;border-top:1px dashed var(--line);padding-top:6px}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#0d1b2a;padding:8px;text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted)}
.tbl td{padding:8px;border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl .num{text-align:center}
.tblwrap{overflow-x:auto}
.fdot{display:inline-block;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:900;color:#fff;text-align:center;line-height:16px;margin:0 1px}
.W{background:var(--green)}.L{background:var(--red)}.N{background:#777}

/* CAP */
.cap{border-radius:12px;padding:16px;position:relative;overflow:hidden}
.cap-o{background:linear-gradient(135deg,#ff6d00,#c43e00)}
.cap-p{background:linear-gradient(135deg,#aa00ff,#6200b3)}
.cap-g{background:linear-gradient(135deg,#ffd700,#b8860b);color:#000}
.cap h3{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.9}
.cap .big{font-size:24px;font-weight:900;margin:4px 0}
.cap .cnum{font-size:40px;font-weight:900;position:absolute;right:14px;top:12px;opacity:.85}
.cap small{opacity:.85;font-size:11px}
.rank{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.rank:last-child{border:0}

/* PLAYER / PANEL */
.pcard{background:var(--card2);border-radius:10px;padding:12px;text-align:center;border-top:2px solid var(--gold)}
.avatar{width:60px;height:60px;border-radius:50%;margin:0 auto 6px;background:linear-gradient(135deg,#1a5e2a,#0d3b66);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;border:2px solid var(--gold)}
.avatar img{width:100%;height:100%;object-fit:cover}
.pcard h4{font-size:14px}.pcard p{font-size:11px;color:var(--muted);margin-top:2px}

/* AUCTION BLOCK */
.ablock{background:radial-gradient(circle at top,#1a5e2a,var(--bg) 70%);border:2px solid var(--gold);border-radius:14px;padding:24px;text-align:center}
.ablock .aprice{font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.5)}
.ablock .apname{font-size:26px;font-weight:900;text-transform:uppercase}
.ablock .hammer{font-size:50px}
.bidteam{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);padding:5px 14px;border-radius:20px;margin-top:6px;font-weight:800;font-size:14px}
.teambtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px;border-radius:10px;cursor:pointer;border:2px solid rgba(255,255,255,.15);color:#fff;font-weight:800;font-size:11px;transition:.15s}
.teambtn:hover{border-color:var(--gold);transform:scale(1.03)}
.teambtn small{opacity:.7;font-weight:600}

/* FORMS */
input,select,textarea{width:100%;padding:8px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.12);background:#0d1b2a;color:#fff;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--gold);border-color:transparent}
input[type=color]{height:38px;padding:2px;cursor:pointer}
label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;display:block;margin-bottom:3px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:6px}.chk input{width:auto}
@media(max-width:600px){.fg{grid-template-columns:1fr}}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:14px;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:2px solid var(--gold);border-radius:14px;width:100%;max-width:680px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #000}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0d1b2a;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.modal-hd h3{color:#fff;font-size:16px}
.modal-hd button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.modal-bd{padding:16px}
.modal-ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:6px;position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}

/* TOAST */
.toast-el{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gold);color:#000;padding:10px 20px;border-radius:20px;font-weight:800;font-size:13px;z-index:300;transition:.3s;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.toast-el.show{transform:translateX(-50%) translateY(0)}
.admin-bar{background:var(--red);color:#fff;text-align:center;font-size:11px;font-weight:700;padding:4px;letter-spacing:.5px}
footer{text-align:center;padding:24px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);margin-top:30px}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.preview{max-width:100px;max-height:80px;border-radius:8px;border:1px solid var(--gold);margin-top:4px}
</style>
</head>
<body>

<div class="header">
<div class="header-inner">
  <div class="site-logo" id="siteLogo" onclick="go('home')">🏏</div>
  <div class="site-title" onclick="go('home')"><b id="siteShort">NPL</b><small id="siteName">Nangnur Premier League</small></div>
  <div class="nav" id="navBar"></div>
  <div class="hdr-btns" id="hdrBtns"></div>
</div>
</div>
<div id="adminBar"></div>
<div class="wrap" id="app"></div>
<footer id="footer"></footer>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast-el" id="toastEl"></div>

<script>
// ============ UTILITIES ============
var KEY='npl_v3';
function uid(){return Math.random().toString(36).slice(2,8)}
function E(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function isUrl(s){return /^(https?:|data:)/.test(String(s||''))}
function oversDec(o){var p=String(o||'0').split('.');return(+p[0]||0)+((+p[1]||0)/6)}

// ============ DEFAULT DATA ============
function makeDefault(){
  var t1=uid(),t2=uid(),t3=uid(),t4=uid();
  function mp(n,v,r,tid,st,sp,stats){return{id:uid(),name:n,village:v||'Nangnur',role:r,batting:'Right Hand',bowling:'Right Arm Medium',phone:'',basePrice:1000,teamId:tid,status:st,soldPrice:sp||0,photo:'',jersey:'',stats:Object.assign({mat:0,inns:0,runs:0,balls:0,fours:0,sixes:0,hs:0,no:0,overs:0,rc:0,wkts:0,bb:''},stats||{})}}
  var d={
    settings:{name:'Nangnur Premier League',short:'NPL',season:'2025',tagline:'Gaon Ka Garv · Cricket Ka Jashn',adminPassword:'npl@admin',registrationOpen:true,maxOvers:10,purse:50000,squadSize:12,playoffSpots:4,venue:'Nangnur Cricket Ground',manOfSeries:'',increment:500,logo:'',banner:''},
    teams:[
      {id:t1,name:'Nangnur Titans',short:'NT',color:'#0b3d91',color2:'#1e90ff',owner:'Ramesh Goud',captain:'Srikanth',purse:41500,logo:'⚡'},
      {id:t2,name:'Nangnur Warriors',short:'NW',color:'#8b0000',color2:'#ff4500',owner:'Venkatesh Reddy',captain:'Rajesh',purse:42000,logo:'🛡️'},
      {id:t3,name:'Nangnur Strikers',short:'NS',color:'#0b6b3a',color2:'#2ecc71',owner:'Mahesh Yadav',captain:'Kiran',purse:43500,logo:'🦁'},
      {id:t4,name:'Nangnur Kings',short:'NK',color:'#6a0dad',color2:'#ffd700',owner:'Suresh Naik',captain:'Naveen',purse:44000,logo:'👑'}
    ],
    players:[
      mp('Srikanth','Nangnur','Batsman',t1,'sold',5000,{mat:3,inns:3,runs:142,balls:96,fours:14,sixes:7,hs:68,no:1}),
      mp('Rajesh','Nangnur','All-Rounder',t2,'sold',4500,{mat:3,inns:3,runs:98,balls:70,fours:9,sixes:4,hs:45,overs:9,rc:71,wkts:6,bb:'3/18'}),
      mp('Kiran','Kotha Nangnur','Bowler',t3,'sold',3500,{mat:3,inns:1,runs:12,balls:9,fours:1,hs:12,overs:9,rc:52,wkts:8,bb:'4/12'}),
      mp('Naveen','Nangnur','Batsman',t4,'sold',4000,{mat:3,inns:3,runs:121,balls:88,fours:12,sixes:5,hs:57}),
      mp('Anil','Nangnur','Wicket-Keeper',t1,'sold',2000,{mat:3,inns:3,runs:64,balls:50,fours:6,sixes:2,hs:31}),
      mp('Praveen','Nangnur','Bowler',t2,'sold',2500,{mat:3,inns:1,runs:5,balls:4,hs:5,overs:9,rc:60,wkts:5,bb:'2/14'}),
      mp('Mahender','Nangnur','All-Rounder',t3,'sold',3000,{mat:3,inns:3,runs:77,balls:55,fours:7,sixes:3,hs:40,overs:8,rc:58,wkts:4,bb:'2/20'}),
      mp('Ravi','Nangnur','Batsman',t4,'sold',2000,{mat:3,inns:3,runs:55,balls:48,fours:5,sixes:1,hs:29}),
      mp('Sandeep','Nangnur','Bowler','','registered',0),
      mp('Vamshi','Nangnur','All-Rounder','','registered',0),
      mp('Ganesh','Nangnur','Batsman','','registered',0),
      mp('Lokesh','Nangnur','Wicket-Keeper','','registered',0)
    ],
    matches:[],
    auction:{currentPlayerId:'',currentBid:0,currentTeamId:'',log:[],hist:[]},
    panels:{
      nca:[{name:'Sri. Ramesh Goud',role:'President',phone:'',photo:''},{name:'Sri. Venkatesh Reddy',role:'Vice President',phone:'',photo:''},{name:'Sri. Mahesh Yadav',role:'General Secretary',phone:'',photo:''},{name:'Sri. Suresh Naik',role:'Treasurer',phone:'',photo:''},{name:'Sri. Srinivas Rao',role:'Joint Secretary',phone:'',photo:''}],
      npl:[{name:'Sri. Krishna Mohan',role:'NPL Chairman',phone:'',photo:''},{name:'Sri. Anjaneyulu',role:'Tournament Convener',phone:'',photo:''},{name:'Sri. Bhaskar',role:'Auction Head',phone:'',photo:''},{name:'Sri. Chandra Shekar',role:'Match Referee',phone:'',photo:''},{name:'Sri. Devender',role:'Head Scorer',phone:'',photo:''},{name:'Sri. Eshwar',role:'Media & Live Updates',phone:'',photo:''},{name:'Sri. Gopal',role:'Ground & Logistics',phone:'',photo:''},{name:'Sri. Harish',role:'Finance & Sponsorship',phone:'',photo:''}]
    }
  };
  // seed matches
  var bd=new Date();bd.setDate(bd.getDate()-3);
  function dt(i){var x=new Date(bd);x.setDate(x.getDate()+i);return x.toISOString().slice(0,10)}
  function pid(n){var f=d.players.find(function(x){return x.name===n});return f?f.id:''}
  d.matches=[
    {id:uid(),no:1,stage:'League',date:dt(0),time:'09:00',venue:d.settings.venue,teamA:t1,teamB:t2,status:'completed',scoreA:112,wktsA:6,oversA:'10',allOutA:false,scoreB:98,wktsB:9,oversB:'10',allOutB:false,winner:t1,result:'Titans won by 14 runs',motm:pid('Srikanth')},
    {id:uid(),no:2,stage:'League',date:dt(0),time:'14:00',venue:d.settings.venue,teamA:t3,teamB:t4,status:'completed',scoreA:87,wktsA:10,oversA:'9.2',allOutA:true,scoreB:88,wktsB:4,oversB:'8.1',allOutB:false,winner:t4,result:'Kings won by 6 wickets',motm:pid('Naveen')},
    {id:uid(),no:3,stage:'League',date:dt(1),time:'09:00',venue:d.settings.venue,teamA:t1,teamB:t3,status:'completed',scoreA:95,wktsA:8,oversA:'10',allOutA:false,scoreB:96,wktsB:5,oversB:'9.4',allOutB:false,winner:t3,result:'Strikers won by 5 wickets',motm:pid('Kiran')},
    {id:uid(),no:4,stage:'League',date:dt(1),time:'14:00',venue:d.settings.venue,teamA:t2,teamB:t4,status:'completed',scoreA:104,wktsA:7,oversA:'10',allOutA:false,scoreB:101,wktsB:8,oversB:'10',allOutB:false,winner:t2,result:'Warriors won by 3 runs',motm:pid('Rajesh')},
    {id:uid(),no:5,stage:'League',date:dt(2),time:'09:00',venue:d.settings.venue,teamA:t1,teamB:t4,status:'completed',scoreA:120,wktsA:5,oversA:'10',allOutA:false,scoreB:110,wktsB:7,oversB:'10',allOutB:false,winner:t1,result:'Titans won by 10 runs',motm:pid('Srikanth')},
    {id:uid(),no:6,stage:'League',date:dt(2),time:'14:00',venue:d.settings.venue,teamA:t2,teamB:t3,status:'completed',scoreA:99,wktsA:8,oversA:'10',allOutA:false,scoreB:100,wktsB:6,oversB:'9.5',allOutB:false,winner:t3,result:'Strikers won by 4 wickets',motm:pid('Mahender')},
    {id:uid(),no:7,stage:'Semi Final',date:dt(5),time:'09:00',venue:d.settings.venue,teamA:t1,teamB:t3,status:'upcoming',scoreA:'',wktsA:'',oversA:'',allOutA:false,scoreB:'',wktsB:'',oversB:'',allOutB:false,winner:'',result:'',motm:''},
    {id:uid(),no:8,stage:'Final',date:dt(7),time:'14:00',venue:d.settings.venue,teamA:'',teamB:'',status:'upcoming',scoreA:'',wktsA:'',oversA:'',allOutA:false,scoreB:'',wktsB:'',oversB:'',allOutB:false,winner:'',result:'',motm:''}
  ];
  d.settings.manOfSeries=pid('Srikanth');
  return d;
}

// ============ STATE ============
var D,isAdmin,page,subPage;
function loadData(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return makeDefault()}
function init(){D=loadData();isAdmin=sessionStorage.getItem('npl_admin')==='1';page='home';subPage={auction:'register',stats:'orange'};render()}
function save(){localStorage.setItem(KEY,JSON.stringify(D));render()}
function team(id){return D.teams.find(function(t){return t.id===id})}
function player(id){return D.players.find(function(p){return p.id===id})}
function tName(id){var t=team(id);return t?t.name:'TBD'}
function tShort(id){var t=team(id);return t?t.short:'TBD'}

// ============ IMAGE UPLOAD ============
function uploadImage(inputId,maxPx){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');
        var scale=Math.min(1,(maxPx||400)/Math.max(img.width,img.height));
        c.width=img.width*scale;c.height=img.height*scale;
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var dataUrl=c.toDataURL('image/jpeg',0.7);
        var el=document.getElementById(inputId);if(el)el.value=dataUrl;
        var prev=document.getElementById(inputId+'_preview');
        if(prev)prev.innerHTML='<img src="'+dataUrl+'" class="preview">';
        toast('Image loaded! Click Save to keep it.');
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}

// ============ FORM BUILDER ============
function fieldHTML(f,val){
  var v=val!=null?val:(f.def!=null?f.def:'');
  var id='f_'+f.k;
  var cls=f.full?' full':'';
  if(f.type==='select'){
    var opts=(f.opts||[]).map(function(o){return '<option value="'+E(o.v)+'"'+(String(o.v)===String(v)?' selected':'')+'>'+E(o.l)+'</option>'}).join('');
    return '<div class="'+cls+'"><label>'+f.label+'</label><select id="'+id+'">'+opts+'</select></div>';
  }
  if(f.type==='checkbox'){return '<div class="'+cls+' chk" style="align-self:end"><input type="checkbox" id="'+id+'"'+(v?' checked':'')+'><label style="margin:0">'+f.label+'</label></div>'}
  if(f.type==='image'){
    return '<div class="'+cls+'"><label>'+f.label+'</label><input type="text" id="'+id+'" value="'+E(v)+'" placeholder="Emoji, URL, or upload below"><div id="'+id+'_preview">'+(v&&isUrl(v)?'<img src="'+E(v)+'" class="preview">':'')+'</div><button type="button" class="btn btn-green btn-sm" style="margin-top:4px" onclick="uploadImage(\''+id+'\','+(f.max||400)+')">📷 Upload from Device</button></div>';
  }
  return '<div class="'+cls+'"><label>'+f.label+(f.req?' *':'')+'</label><input type="'+(f.type||'text')+'" id="'+id+'" value="'+E(v)+'" placeholder="'+E(f.ph||'')+'"'+(f.step?' step="'+f.step+'"':'')+'></div>';
}
function openForm(title,fields,vals,onSave,extraBtns){
  vals=vals||{};
  var html='<div class="fg">'+fields.map(function(f){return fieldHTML(f,vals[f.k])}).join('')+'</div>';
  var foot=(extraBtns||'')+'<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-gold" id="formSaveBtn">💾 Save</button>';
  openModal(title,html,foot);
  document.getElementById('formSaveBtn').onclick=function(){
    var out={};for(var k in vals)out[k]=vals[k];
    for(var i=0;i<fields.length;i++){
      var f=fields[i];var el=document.getElementById('f_'+f.k);if(!el)continue;
      var v;
      if(f.type==='checkbox')v=el.checked;
      else if(f.type==='number'){v=el.value===''?'':+el.value}
      else v=el.value.trim();
      if(f.req&&(v===''||v==null)){toast('Please fill: '+f.label);return}
      out[f.k]=v;
    }
    if(onSave(out)!==false)closeModal();
  };
}

// ============ COMPUTATIONS ============
function pointsTable(){
  var t={};D.teams.forEach(function(x){t[x.id]={team:x,p:0,w:0,l:0,nr:0,pts:0,rf:0,of:0,ra:0,oa:0,form:[]}});
  var mo=+D.settings.maxOvers||10;
  D.matches.filter(function(m){return m.status==='completed'&&m.stage==='League'}).forEach(function(m){
    var a=t[m.teamA],b=t[m.teamB];if(!a||!b)return;a.p++;b.p++;
    if(m.winner==='tie'||m.winner==='nr'){a.nr++;b.nr++;a.pts++;b.pts++;a.form.push('N');b.form.push('N')}
    else if(m.winner===m.teamA){a.w++;b.l++;a.pts+=2;a.form.push('W');b.form.push('L')}
    else if(m.winner===m.teamB){b.w++;a.l++;b.pts+=2;b.form.push('W');a.form.push('L')}
    var oA=m.allOutA?mo:oversDec(m.oversA),oB=m.allOutB?mo:oversDec(m.oversB);
    a.rf+=+m.scoreA||0;a.of+=oA;a.ra+=+m.scoreB||0;a.oa+=oB;
    b.rf+=+m.scoreB||0;b.of+=oB;b.ra+=+m.scoreA||0;b.oa+=oA;
  });
  return Object.values(t).map(function(r){r.nrr=(r.of?r.rf/r.of:0)-(r.oa?r.ra/r.oa:0);return r}).sort(function(a,b){return b.pts-a.pts||b.nrr-a.nrr||b.w-a.w});
}
function batAvg(p){var s=S(p);var o=(s.inns||0)-(s.no||0);return o>0?(s.runs/o).toFixed(1):(s.runs?s.runs+'*':'-')}
function batSR(p){var s=S(p);return s.balls?(s.runs/s.balls*100).toFixed(1):'-'}
function bowlEcon(p){var s=S(p);var o=oversDec(s.overs);return o?(s.rc/o).toFixed(2):'-'}
function topRunScorers(){return D.players.filter(function(p){return S(p).runs>0}).sort(function(a,b){return S(b).runs-S(a).runs})}
function topWicketTakers(){return D.players.filter(function(p){return S(p).wkts>0}).sort(function(a,b){return S(b).wkts-S(a).wkts})}
function motmCounts(){var c={};D.matches.forEach(function(m){if(m.motm)c[m.motm]=(c[m.motm]||0)+1});return Object.entries(c).sort(function(a,b){return b[1]-a[1]})}

function regPlayer(){
  var g=function(id){return document.getElementById(id).value.trim()};
  var name=g('r_name'),phone=g('r_phone');
  if(!name){toast('Enter your name');return}
  if(!/^\d{10}$/.test(phone)){toast('Enter valid 10-digit mobile');return}
  if(D.players.some(function(p){return p.phone===phone})){toast('Mobile already registered');return}
  D.players.push({id:uid(),name:name,village:g('r_village'),phone:phone,role:g('r_role'),batting:g('r_bat'),bowling:g('r_bowl'),basePrice:+g('r_base'),jersey:g('r_jersey'),photo:'',teamId:'',status:'registered',soldPrice:0,stats:{mat:0,inns:0,runs:0,balls:0,fours:0,sixes:0,hs:0,no:0,overs:0,rc:0,wkts:0,bb:''}});
  save();toast('🎉 Registered! Good luck '+name);
}
function viewAuctionRoom(){
  var a=D.auction;var p=player(a.currentPlayerId);var bt=team(a.currentTeamId);
  var pool=D.players.filter(function(x){return x.status==='registered'});
  var h='<div class="ablock">';
  if(p){
    h+='<div class="avatar" style="width:90px;height:90px;font-size:40px;margin:0 auto 8px">'+(p.photo?'<img src="'+E(p.photo)+'">':'🏏')+'</div>';
    h+='<div class="apname">'+E(p.name)+'</div>';
    h+='<div class="muted" style="color:#adc">'+E(p.role)+' · '+E(p.village)+'</div>';
    h+='<div style="margin-top:10px;font-size:12px;color:#9bc">'+(bt?'CURRENT BID':'BASE PRICE')+'</div>';
    h+='<div class="aprice">'+money(bt?a.currentBid:p.basePrice)+'</div>';
    if(bt)h+='<div class="bidteam">'+TL(bt,24)+' '+E(bt.name)+'</div>';
    else h+='<div class="bidteam">Waiting for bids…</div>';
  }else{
    h+='<div class="hammer">🔨</div><div class="apname">Auction Room</div>';

function autoGen(){
  if(D.teams.length<2){toast('Need 2+ teams');return}
  openForm('⚡ Auto-Generate',[
    {k:'start',label:'Start Date',type:'date',req:true,def:new Date().toISOString().slice(0,10)},
    {k:'perDay',label:'Matches/Day',type:'number',def:2},
    {k:'clear',label:'Remove old league matches',type:'checkbox',def:true}
  ],{},function(v){
    if(v.clear)D.matches=D.matches.filter(function(m){return m.stage!=='League'});
    var pairs=[];for(var i=0;i<D.teams.length;i++)for(var j=i+1;j<D.teams.length;j++)pairs.push([D.teams[i].id,D.teams[j].id]);
    pairs.sort(function(){return Math.random()-.5});
    var no=D.matches.length+1;var d=new Date(v.start);var times=['09:00','14:00'];
    pairs.forEach(function(p,i){
      var slot=i%(+v.perDay||2);if(i>0&&slot===0)d.setDate(d.getDate()+1);
      D.matches.push({id:uid(),no:no++,stage:'League',date:d.toISOString().slice(0,10),time:times[slot%2],venue:D.settings.venue,teamA:p[0],teamB:p[1],status:'upcoming',scoreA:'',wktsA:'',oversA:'',allOutA:false,scoreB:'',wktsB:'',oversB:'',allOutB:false,winner:'',result:'',motm:''});
    });
    save();toast(pairs.length+' matches generated');
  });
}

}
function viewAwards(){
  var mos=player(D.settings.manOfSeries);var mc=motmCounts();
  var h='<div class="grid g2">';
  h+='<div class="cap cap-g" style="padding:22px"><h3>🏆 Man of the Series</h3>';
  if(mos){h+='<div class="big" style="font-size:28px">'+E(mos.name)+'</div><small>'+E(tName(mos.teamId))+' · '+S(mos).runs+' runs · '+S(mos).wkts+' wkts</small><div class="cnum" style="font-size:54px">🏅</div>'}
  else h+='<div class="big">To be announced</div>';
  h+=adm('<button class="btn btn-ghost btn-sm" style="margin-top:8px;color:#000;border-color:#000" onclick="openSettings()">Set in Settings</button>');
  h+='</div>';
  h+='<div class="card"><div class="card-title">⭐ Most MOTM Awards</div>';
  if(mc.length)mc.forEach(function(x,i){var p=player(x[0]);if(p)h+='<div class="rank"><span>'+(i+1)+'. <b>'+E(p.name)+'</b> <span class="muted">'+E(tShort(p.teamId))+'</span></span><b style="color:var(--gold)">'+x[1]+' ⭐</b></div>'});
  else h+='<div class="empty">No awards yet</div>';
  h+='</div></div>';
  h+='<div class="card" style="margin-top:12px"><div class="card-title">🎖️ MOTM — All Matches</div><div class="grid g4">';
  D.matches.filter(function(m){return m.motm}).forEach(function(m){
    var p=player(m.motm);
    h+='<div class="pcard"><div class="avatar">'+(p&&p.photo?'<img src="'+E(p.photo)+'">':'🏏')+'</div><h4>'+E(p?p.name:'—')+'</h4><p style="color:var(--gold)">M'+m.no+' · '+E(m.stage)+'</p><p>'+E(tShort(m.teamA))+' vs '+E(tShort(m.teamB))+'</p></div>';
  });
  h+='</div></div>';
  return h;
}
function viewAllStats(){
  var l=D.players.slice().sort(function(a,b){return(S(b).runs+S(b).wkts*20)-(S(a).runs+S(a).wkts*20)});
  var h='<div class="card"><div class="card-title">📋 All Players Stats</div><div class="tblwrap"><table class="tbl"><tr><th>Player</th><th>Team</th><th>Role</th><th class="num">Mat</th><th class="num">Runs</th><th class="num">HS</th><th class="num">Wkts</th><th class="num">Best</th>'+adm('<th></th>')+'</tr>';
  l.forEach(function(p){h+='<tr><td><b>'+E(p.name)+'</b></td><td>'+E(p.teamId?tShort(p.teamId):'—')+'</td><td>'+E(p.role)+'</td><td class="num">'+(S(p).mat||0)+'</td><td class="num">'+(S(p).runs||0)+'</td><td class="num">'+(S(p).hs||0)+'</td><td class="num">'+(S(p).wkts||0)+'</td><td class="num">'+E(S(p).bb||'-')+'</td>'+adm('<td><button class="btn btn-gold btn-sm" onclick="editStats(\''+p.id+'\')">✏️</button></td>')+'</tr>'});
  h+='</table></div></div>';
  return h;
}

// ============ PANEL ============
function viewPanel(){
  function panelCard(m,grp,i){
    return '<div class="pcard"><div class="avatar">'+(m.photo&&isUrl(m.photo)?'<img src="'+E(m.photo)+'">':'👤')+'</div><h4>'+E(m.name||'Vacant')+'</h4><p style="color:var(--gold);font-weight:700">'+E(m.role)+'</p>'+(m.phone?'<p>📞 '+E(m.phone)+'</p>':'')+adm('<button class="btn btn-gold btn-sm" style="margin-top:6px" onclick="editPanel(\''+grp+'\','+i+')">✏️</button>')+'</div>';
  }
  var h='<div class="card-title" style="font-size:24px">👥 Organising <span style="color:var(--gold)">Panel</span></div>';
  h+='<div class="card"><div class="card-title">🏛️ Nangnur Cricket Association (NCA) <span class="badge by">'+D.panels.nca.length+' Members</span></div><div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">';
  D.panels.nca.forEach(function(m,i){h+=panelCard(m,'nca',i)});
  h+='</div></div>';
  h+='<div class="card"><div class="card-title">🏏 '+E(D.settings.short)+' Tournament Panel <span class="badge bg">'+D.panels.npl.length+' Members</span></div><div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">';
  D.panels.npl.forEach(function(m,i){h+=panelCard(m,'npl',i)});
  h+='</div></div>';
  return h;
}
function editPanel(grp,i){
  var m=D.panels[grp][i];
  openForm('✏️ Edit Panel Member',[
    {k:'name',label:'Name',req:true},{k:'role',label:'Role',req:true},
    {k:'phone',label:'Phone'},{k:'photo',label:'Photo',type:'image',max:300}
  ],m,function(v){D.panels[grp][i]=v;save();toast('Panel updated')});
}

// ============ BOOT ============
init();
</script>
</body>
</html>
